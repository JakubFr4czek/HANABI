# Smoke check for the Raspberry Pi runner (raspberka, linux-arm64).
# Only proves the runner picks up jobs and Godot 4.7.2 arm64 runs headless; nothing else targets this runner yet.
name: pi-smoke

on:
  workflow_dispatch:
  push:
    branches: [ci/raspberka]

permissions:
  contents: read

concurrency:
  group: hanabi-pi-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Pi runner smoke
    runs-on: [self-hosted, raspberka]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Runner info
        run: uname -a; nproc; free -m; df -h .
      - name: Godot version
        run: ~/ci-tools/godot/Godot_v4.7.2-stable_linux.arm64 --version
      # Project scenes need a full asset import (too heavy for a 2 GB Pi smoke check), so only boot the engine headless.
      - name: Godot headless boot
        run: |
          printf 'extends SceneTree\nfunc _init():\n\tprint("pi-smoke OK ", Engine.get_version_info().string)\n\tquit(0)\n' > "$RUNNER_TEMP/smoke.gd"
          cd "$RUNNER_TEMP"  # outside the checkout, so Godot does not pick up project.godot
          timeout 120 ~/ci-tools/godot/Godot_v4.7.2-stable_linux.arm64 --headless --script "$RUNNER_TEMP/smoke.gd" | tee "$RUNNER_TEMP/smoke.log"
          grep -q "pi-smoke OK" "$RUNNER_TEMP/smoke.log"
